name: Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: "Build and test (JDK ${{ matrix.java }}, Gradle ${{ matrix.gradle }})"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        java: [ 17, 21 ]
        gradle: [ '8.9', '8.12.1', '8.14.3' ]

    permissions:
      contents: write
      pull-requests: write
      checks: write
      security-events: write

    timeout-minutes: 60

    steps:
      - name: Checkout

        uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.java }}

      - name: Ktlinkt
        run: ./gradlew ktlintCheck

      - name: test
        id: test
        run: ./gradlew test -DtestGradleVersion=${{ matrix.gradle }}
        env:
          GE_API_KEY: ${{ secrets.GE_API }}
          GE_URL: ${{ secrets.GE_URL }}

      - name: Archive JUnit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-reports-jdk${{ matrix.java }}-gradle${{ matrix.gradle }}
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**
          retention-days: 14
          if-no-files-found: warn

      - name: Publish JUnit report summary
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: '**/build/test-results/**/TEST-*.xml'
          check_name: JUnit Test Report (JDK ${{ matrix.java }}, Gradle ${{ matrix.gradle }})
          fail_on_failure: false
