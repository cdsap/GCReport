name: Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: "Build and test"
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      checks: write
      security-events: write

    timeout-minutes: 60

    steps:
      - name: Checkout

        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Ktlinkt
        run: ./gradlew ktlintCheck

      - name: test
        id: test
        run: ./gradlew test
        env:
          GE_API_KEY: ${{ secrets.GE_API }}
          GE_URL: ${{ secrets.GE_URL }}

      - name: Archive JUnit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-reports
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**
          retention-days: 14
          if-no-files-found: warn

      - name: Publish JUnit report summary
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: '**/build/test-results/**/TEST-*.xml'
          check_name: JUnit Test Report
          fail_on_failure: false
